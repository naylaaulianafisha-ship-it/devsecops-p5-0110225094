name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit test + coverage (Quality Gate - coverage minimal 80%)
        run: pytest --cov=securetask --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sast-scan:
    name: SAST Scan (Bandit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit>=1.7.9"

      - name: Run Bandit (JSON report)
        run: bandit -r securetask main.py -f json -o bandit-report.json --exit-zero

      - name: Show readable summary
        run: bandit -r securetask main.py --exit-zero

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Quality Gate (gagal jika ada temuan MEDIUM/HIGH)
        run: |
          python - <<'PY'
          import json, sys
          totals = json.load(open("bandit-report.json"))["metrics"]["_totals"]
          high = int(totals["SEVERITY.HIGH"])
          medium = int(totals["SEVERITY.MEDIUM"])
          low = int(totals["SEVERITY.LOW"])
          print(f"Bandit findings -> HIGH={high} MEDIUM={medium} LOW={low}")
          if high or medium:
              print("QUALITY GATE FAILED")
              sys.exit(1)
          print("QUALITY GATE PASSED")
          PY
